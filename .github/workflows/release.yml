# ColdBend Pro — Release Workflow (v1.0.0)
# macOS (.dmg + .zip) ve Windows (.exe NSIS + Portable) üretir,
# GitHub Release'e ekler. Tarayıcı sürümü etkilenmez.

name: Release v1.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release versiyonu (örn. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: macOS paketini derle (.dmg + .zip)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Artifact yükle (mac)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-mac-v1.0.0
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-win:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: Windows paketini derle (.exe)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact yükle (win)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-win-v1.0.0
          path: |
            dist/*.exe
          if-no-files-found: error

  publish-release:
    name: GitHub Release yayınla
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Artifactleri indir (mac)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-mac-v1.0.0
          path: ./artifacts/mac

      - name: Artifactleri indir (win)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-win-v1.0.0
          path: ./artifacts/win

      - name: Release oluştur (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ColdBend Pro v1.0.0
          body_path: RELEASE_NOTES_v1.0.md
          draft: false
          prerelease: false
          files: |
            artifacts/mac/*
            artifacts/win/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
