# ColdBend Pro — Release Workflow
# Etiket (örn. v2.4.0) push'lanınca çalışır; versiyon etiket adından alınır,
# arayüz rozeti / package.json / dosya adları aynı versiyonu taşır.
#
# Üretilen 4 grup:
#   1. Browser (Web): ColdBend-Pro-Web-vX.Y.Z.zip  (index.html çift-tıkla açılır)
#   2. macOS Desktop: .dmg (+ .zip, x64 + arm64)
#   3. Windows Portable: ColdBend-Pro-Portable-vX.Y.Z.exe (kurulumsuz, çift-tıkla)
#   4. Windows Setup: ColdBend-Pro-Setup-vX.Y.Z.exe (NSIS, masaüstü kısayollu)

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Browser paketi (Web zip)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: Web paketini hazırla (.zip)
        run: |
          REF="${{ github.ref_name }}"
          [ -z "$REF" ] || [ "$REF" = "main" ] && REF="v$(node -p "require('./package.json').version")"
          echo "Paket versiyonu: $REF"
          zip -r "ColdBend-Pro-Web-${REF}.zip" index.html app.js style.css lib/ RELEASE_NOTES_${REF}.md
          ls -la *.zip

      - name: Artifact yükle (web)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-web-${{ github.ref_name }}
          path: ColdBend-Pro-Web-*.zip
          if-no-files-found: error

  build-mac-x64:
    name: macOS Intel (.dmg)
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: macOS Intel paketini derle (.dmg)
        run: npx electron-builder --mac --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Artifact yükle (mac x64)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-mac-x64-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error

  build-mac-arm64:
    name: macOS Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: macOS Silicon paketini derle (.dmg)
        run: npx electron-builder --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Artifact yükle (mac arm64)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-mac-arm64-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Hesap motoru sözdizimi kontrolü
        run: npm run check

      - name: Windows paketini derle (.exe)
        run: npm run dist:win

      - name: Artifact yükle (win)
        uses: actions/upload-artifact@v4
        with:
          name: ColdBend-Pro-win-${{ github.ref_name }}
          path: |
            dist/*.exe
          if-no-files-found: error

  publish-release:
    name: GitHub Release yayınla
    needs: [build-web, build-mac-x64, build-mac-arm64, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Artifactleri indir (web)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-web-${{ github.ref_name }}
          path: ./artifacts/web

      - name: Artifactleri indir (mac x64)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-mac-x64-${{ github.ref_name }}
          path: ./artifacts/mac-x64

      - name: Artifactleri indir (mac arm64)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-mac-arm64-${{ github.ref_name }}
          path: ./artifacts/mac-arm64

      - name: Artifactleri indir (win)
        uses: actions/download-artifact@v4
        with:
          name: ColdBend-Pro-win-${{ github.ref_name }}
          path: ./artifacts/win

      - name: Release oluştur (${{ github.ref_name }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ColdBend Pro ${{ github.ref_name }}
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
          files: |
            artifacts/web/*.zip
            artifacts/mac-x64/*.dmg
            artifacts/mac-arm64/*.dmg
            artifacts/win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
